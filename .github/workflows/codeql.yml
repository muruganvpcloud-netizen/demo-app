name: CodeQL security analysis
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
 
permissions:
  contents: read
 
jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
 
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
 
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
